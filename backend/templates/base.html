<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}SyncCircle{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/static/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ style_version() }}">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">
      <span class="brand-mark-box">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
          <circle cx="16" cy="6" r="2.4" fill="currentColor"/>
          <circle cx="23.07" cy="8.93" r="2.4" fill="currentColor"/>
          <circle cx="26" cy="16" r="2.4" fill="currentColor"/>
          <circle cx="23.07" cy="23.07" r="2.4" fill="currentColor"/>
          <circle cx="16" cy="26" r="2.4" fill="currentColor"/>
          <circle cx="8.93" cy="23.07" r="2.4" fill="currentColor"/>
          <circle cx="6" cy="16" r="2.4" fill="currentColor"/>
          <circle cx="8.93" cy="8.93" r="2.4" fill="currentColor"/>
        </svg>
      </span>
      SyncCircle
    </a>
    <div class="header-right">
      {% if group is defined and group %}
      <ul class="nav-icons">
        <li class="nav-icon">
          <a class="nav-icon-box" href="/groups/{{ group.id }}" aria-label="Dashboard">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <span class="nav-icon-label">Dashboard</span>
        </li>
        <li class="nav-icon">
          <a class="nav-icon-box" href="/groups/{{ group.id }}/favorites" aria-label="Favorite spots">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 18.8 6.1 22l1.2-6.5-4.8-4.6 6.6-.9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </a>
          <span class="nav-icon-label">Favorites</span>
        </li>
        <li class="nav-icon">
          <a class="nav-icon-box" href="/groups/{{ group.id }}/preferences" aria-label="Preferences">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <span class="nav-icon-label">Prefs</span>
        </li>
      </ul>
      {% else %}
      <span class="tagline">plans itself, mostly</span>
      {% endif %}
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <main class="{% block wrap_class %}wrap{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js?v={{ script_version() }}" defer></script>
</body>
</html>
