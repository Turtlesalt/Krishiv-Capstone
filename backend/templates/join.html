{% extends "base.html" %}
{% from "_member_fields.html" import member_fields %}
{% block wrap_class %}wrap-narrow{% endblock %}
{% block content %}
<h1>You're invited to "{{ group.name }}"</h1>
<p class="lede">Add yourself so the next plan counts you in.</p>

<div class="card">
  <form method="post" action="/groups/{{ group.id }}/join">
    {{ member_fields() }}
    <button type="submit">I'm in</button>
  </form>
</div>
{% endblock %}
